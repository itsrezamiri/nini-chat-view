<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Nini Chat View</title>
<style>
  body {
    font-family: 'IRANSansNumber', Tahoma, 'Vazirmatn', sans-serif;
    width: 230px;
    padding: 14px;
    direction: rtl;
    color: #222;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 12px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  label {
    font-size: 13px;
  }
  select {
    width: 110px;
  }
  input[type="range"] {
    width: 110px;
  }
  #fontSizeValue {
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>
  <h1>نمای گفتگوی نی‌نی‌سایت</h1>

  <div class="row">
    <label for="enabled">فعال‌سازی نمای گفتگو</label>
    <input type="checkbox" id="enabled">
  </div>

  <div class="row">
    <label for="theme">تم</label>
    <select id="theme">
      <option value="light">روشن</option>
      <option value="dark">تیره</option>
    </select>
  </div>

  <div class="row">
    <label for="align">چینش پیام‌ها</label>
    <select id="align">
      <option value="right">راست</option>
      <option value="center">وسط</option>
      <option value="left">چپ</option>
      <option value="focused">متمرکز (ستون وسط)</option>
    </select>
  </div>

  <div class="row">
    <label for="fontSize">اندازه فونت</label>
    <input type="range" id="fontSize" min="12" max="20" step="1">
  </div>
  <div class="row">
    <span></span>
    <span id="fontSizeValue"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
